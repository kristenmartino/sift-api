name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # Dev tooling is split out so it never ships to the Railway image (the
      # Dockerfile installs requirements.txt only). requirements-dev.txt
      # includes requirements.txt via -r.
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Coverage floor lives in pyproject.toml ([tool.coverage.report]
      # fail_under). It is a ratchet set just under the measured value, not an
      # aspirational target.
      - name: Test
        run: pytest tests/ -v --cov --cov-report=term-missing

  feed-perf:
    name: Feed Query Perf
    # Only runs when a PR touches the query surface or the diagnostic script.
    # Guards against plan regressions landing in main without being noticed.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          # Need enough history to diff against the PR base.
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- \
              app/db.py \
              migrations \
              scripts/explain_feed_queries.py \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install deps
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: EXPLAIN ANALYZE feed queries
        if: steps.changes.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/explain_feed_queries.py
