name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # Dev tooling is split out so it never ships to the Railway image (the
      # Dockerfile installs requirements.txt only). requirements-dev.txt
      # includes requirements.txt via -r.
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Coverage floor lives in pyproject.toml ([tool.coverage.report]
      # fail_under). It is a ratchet set just under the measured value, not an
      # aspirational target.
      - name: Test
        run: pytest tests/ -v --cov --cov-report=term-missing

  clustering-replay:
    name: Clustering Replay
    # scripts/eval_clustering.py's docstring has said "--replay is what CI runs"
    # since it was written, and until 2026-08-13 it was not — the fixtures and
    # baseline it replays did not exist, so the free deterministic path had
    # never executed once. This is that claim made true.
    #
    # Free and offline: no API key, no DATABASE_URL. It re-scores committed
    # responses, so the only things that can move a number are the parser, the
    # metrics, or the corpus — all deliberate edits, which is exactly what a
    # gate should catch. Live runs stay out of CI for nondeterminism, not cost.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same in-job diff shape as feed-perf below rather than a workflow-level
      # `paths:` filter, so the job still reports a status on every PR — which
      # is what branch protection's required-check semantics need.
      - name: Detect relevant changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- \
              services/story_clusterer.py \
              services/cluster_metrics.py \
              scripts/eval_clustering.py \
              data/eval \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install deps
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Replay clustering fixtures
        if: steps.changes.outputs.run == 'true'
        run: python scripts/eval_clustering.py --replay

  feed-perf:
    name: Feed Query Perf
    # Only runs when a PR touches the query surface or the diagnostic script.
    # Guards against plan regressions landing in main without being noticed.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history to diff against the PR base.
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- \
              app/db.py \
              migrations \
              scripts/explain_feed_queries.py \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install deps
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: EXPLAIN ANALYZE feed queries
        if: steps.changes.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/explain_feed_queries.py
