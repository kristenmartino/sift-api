name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Escape hatch for the feed-perf job below, whose automatic trigger is
  # deliberately narrow. Run it by hand against any branch when a change
  # could move a query plan without touching migrations/.
  workflow_dispatch: {}

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes, so a wedged step burns six
    # hours of runner time before anything notices. sift's typecheck job hung
    # 22 minutes on apt-get on 2026-08-17 and was only caught by hand; these
    # jobs have the same exposure and none of them should ever run long.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # Dev tooling is split out so it never ships to the Railway image (the
      # Dockerfile installs requirements.txt only). requirements-dev.txt
      # includes requirements.txt via -r.
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Coverage floor lives in pyproject.toml ([tool.coverage.report]
      # fail_under). It is a ratchet set just under the measured value, not an
      # aspirational target.
      - name: Test
        run: pytest tests/ -v --cov --cov-report=term-missing

  clustering-replay:
    name: Clustering Replay
    # scripts/eval_clustering.py's docstring has said "--replay is what CI runs"
    # since it was written, and until 2026-08-13 it was not — the fixtures and
    # baseline it replays did not exist, so the free deterministic path had
    # never executed once. This is that claim made true.
    #
    # Free and offline: no API key, no DATABASE_URL. It re-scores committed
    # responses, so the only things that can move a number are the parser, the
    # metrics, or the corpus — all deliberate edits, which is exactly what a
    # gate should catch. Live runs stay out of CI for nondeterminism, not cost.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same in-job diff shape as feed-perf below rather than a workflow-level
      # `paths:` filter, so the job still reports a status on every PR — which
      # is what branch protection's required-check semantics need.
      - name: Detect relevant changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- \
              services/story_clusterer.py \
              services/cluster_metrics.py \
              scripts/eval_clustering.py \
              data/eval \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install deps
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Replay clustering fixtures
        if: steps.changes.outputs.run == 'true'
        run: python scripts/eval_clustering.py --replay

  feed-perf:
    name: Feed Query Perf
    # Only runs when a PR touches the query surface or the diagnostic script.
    # Guards against plan regressions landing in main without being noticed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history to diff against the PR base.
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        # This step runs EXPLAIN ANALYZE against PRODUCTION Neon, so the
        # trigger should be exactly the set of changes that can move a query
        # plan — no wider.
        #
        # app/db.py used to be in this list and no longer is. It is a big
        # file, most of it pool wiring and helper queries, and editing any of
        # it woke the prod compute for a plan check it could not affect.
        # Dropping it is safe because of a convention the file itself already
        # states (app/db.py:52-58, :660-667): every index created in
        # _apply_migrations is mirrored into a migrations/*.sql file, so any
        # DDL that can change a plan lands under migrations/ too. That
        # convention is now load-bearing for CI — see CLAUDE.md.
        #
        # If you need this on an app/db.py-only change, add the `feed-perf`
        # label or use workflow_dispatch.
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'feed-perf') }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — forcing the plan check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_LABEL" = "true" ]; then
            echo "feed-perf label present — forcing the plan check."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- \
              migrations \
              init.sql \
              scripts/explain_feed_queries.py \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install deps
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: EXPLAIN ANALYZE feed queries
        if: steps.changes.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/explain_feed_queries.py
