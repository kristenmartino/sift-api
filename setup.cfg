# mutmut config only. Everything else lives in pyproject.toml — mutmut 3.x
# reads its settings from setup.cfg and does not support pyproject.
#
# Mutation testing answers the question coverage cannot: "do these tests
# actually catch bugs, or do they just execute lines?" It injects small
# changes (< becomes <=, + becomes -, a constant shifts) and reports how many
# your tests notice. A surviving mutant is a line your tests run but do not
# check.
#
# SCOPE IS DELIBERATELY NARROW. Do not point this at all of services/. Most of
# that module is LLM/DB I/O where the tests mock the client, so mutants are
# either equivalent or unkillable — you would burn 45 minutes to learn nothing.
# These three are pure, deterministic, and high-consequence:
#
#   quality_gate.py    decides which AI lines reach users
#   cluster_metrics.py the eval's own scoring math — if it is wrong, every
#                      clustering number reported is wrong
#   rss.py             stable_hash / compute_content_hash — the article
#                      primary key and the dedup key
#
# Run it manually every month or two, NOT in CI: ~20-30 min serially is the
# wrong cost/benefit per-PR, and a noisy score gate produces alarms you learn
# to ignore. Record the result in a comment at the top of the matching test
# file and fix only the survivors that represent real gaps.
#
#   .venv/bin/mutmut run
#   .venv/bin/mutmut results
#   .venv/bin/mutmut show <id>

[mutmut]
# Only modules that import nothing outside the stdlib can go here. mutmut 3.x
# runs pytest inside a `mutants/` copy containing ONLY the mutated sources, so
# a module with a first-party import fails to load there.
#
# services/rss.py is a wanted target — stable_hash and compute_content_hash are
# the article primary key and the dedup key — but it imports app.models and so
# cannot be mutated under this workspace model. Its protection is the pinned
# golden hashes in tests/test_rss.py instead (see TestStableHash /
# TestComputeContentHash), which are cross-checked against the TypeScript
# implementation in sift/__tests__/utils.test.ts.
#
# workflows/incremental_threading.py is wanted for the same reason and blocked
# the same way — `seed_story_id` is story identity, and its test was a
# tautology until 2026-08-17 (`f(x) == f(x)`, checked in a test whose comment
# claimed a member had joined; nothing had). It imports services.cost_guard and
# services.cost_estimates, so it cannot come in here either. Same substitute:
# tests/test_incremental_threading.py now pins the golden literal
# "384293b3b19d2851" for sha256("politics|a1|n1")[:16] and grows a story
# through _attach for real. Recomputing the expectation with seed_story_id was
# itself the trap — under a mutated hash the fixture and the assertion move
# together and the test stays green, which the first draft of that test did.
source_paths =
    services/cluster_metrics.py
    services/quality_gate.py

# Narrow test selection for the same reason, and it cuts the run to ~2 minutes.
pytest_add_cli_args_test_selection =
    tests/test_cluster_metrics.py
    tests/test_quality_gate.py
